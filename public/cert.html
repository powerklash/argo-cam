<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>Argo</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-logo" src="icon.svg" alt="" width="64" height="64">
    <h1>Argo</h1>
    <h2 data-i18n="cert.title">Certificato per il telefono</h2>
    <p class="note" data-i18n="cert.intro"></p>
    <form id="cert" method="post" action="/cert/download" autocomplete="off">
      <label><span data-i18n="cert.password">Password</span>
        <input name="password" type="password" autocomplete="off" required autofocus>
      </label>
      <p id="error" class="error" role="alert" hidden></p>
      <button class="primary" type="submit" name="format" value="ios" id="btn-ios" data-i18n="cert.downloadIos">iPhone / iPad: installa il profilo</button>
      <button type="submit" name="format" value="crt" data-i18n="cert.download">Android / PC: scarica il certificato</button>
    </form>
    <p id="off" class="error" hidden data-i18n="cert.off"></p>
    <details class="howto">
      <summary data-i18n="cert.howto">Come si installa</summary>
      <h3>iPhone / iPad</h3>
      <p class="note" data-i18n="cert.ios"></p>
      <h3>Android</h3>
      <p class="note" data-i18n="cert.android"></p>
      <h3>Windows</h3>
      <p class="note" data-i18n="cert.pc"></p>
    </details>
    <a class="linklike" href="/login.html" data-i18n="rec.back">← Torna all’accesso</a>
    <select id="lang" aria-label="Language"></select>
  </main>
  <script type="module" src="cert.js"></script>
</body>
</html>
