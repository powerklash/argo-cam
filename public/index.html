<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Argo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Argo</h1>
    <span id="count"></span>
    <div class="spacer"></div>
    <label class="view-pick"><span data-i18n="view">Vista</span>
      <select id="layout"></select>
    </label>
    <button id="btn-events" data-i18n="btn.events">Eventi</button>
    <button id="btn-settings" data-i18n="btn.settings">Impostazioni</button>
    <button id="btn-full" data-i18n="btn.fullscreen">Schermo intero</button>
    <button id="btn-add" class="primary admin-only" data-i18n="btn.add">+ Telecamera</button>
    <div class="user-wrap">
      <button id="btn-user" aria-haspopup="menu" aria-expanded="false"><span id="user-icon" aria-hidden="true">👤</span><span id="user-name"></span></button>
      <div id="user-menu" role="menu" hidden>
        <div class="who"><b id="um-name"></b><span id="um-role"></span></div>
        <button role="menuitem" id="um-password" data-i18n="user.changePassword"></button>
        <a role="menuitem" id="um-admin" class="admin-only" href="/admin.html" data-i18n="user.admin"></a>
        <button role="menuitem" id="um-logout" data-i18n="user.logout"></button>
      </div>
    </div>
  </header>

  <main id="grid"></main>

  <aside id="panel" hidden>
    <div class="panel-head">
      <div>
        <strong id="panel-title"></strong>
        <div id="panel-sub"></div>
      </div>
      <button id="panel-close" aria-label="Close">✕</button>
    </div>
    <div id="panel-body"></div>
    <div id="panel-status"></div>
  </aside>

  <div id="empty" hidden>
    <p id="empty-text" data-i18n="empty">Nessuna telecamera configurata.</p>
    <button class="primary admin-only" id="btn-add-empty" data-i18n="empty.add">+ Aggiungi telecamera</button>
  </div>

  <!-- Nuova / modifica telecamera (solo amministratore) -->
  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlg-title"></h2>
      <label><span data-i18n="dlg.name">Nome</span><input name="name" required maxlength="60"></label>
      <label><span data-i18n="dlg.brand">Marca</span><select name="brand"></select></label>
      <div id="scan-box" class="scan-box">
        <button type="button" id="btn-scan" data-i18n="scan.button">Cerca telecamere in rete</button>
        <div id="scan-progress" class="scan-progress" hidden>
          <progress id="scan-bar" max="100" value="0"></progress>
          <span id="scan-pct" class="note"></span>
          <button type="button" id="btn-scan-stop" data-i18n="scan.stop">Interrompi</button>
        </div>
        <p class="note scan-hint" data-i18n="scan.hubHint"></p>
        <p id="scan-status" class="note" hidden></p>
        <div id="scan-results" class="scan-results"></div>
      </div>
      <p id="note" class="note"></p>
      <div id="fields"></div>
      <label class="check"><input type="checkbox" name="preload" checked><span data-i18n="dlg.preload"></span></label>
      <label class="check"><input type="checkbox" name="battery"><span data-i18n="dlg.battery"></span></label>
      <label><span data-i18n="dlg.wakeLimit"></span><input type="number" name="wakeLimit" min="0" max="3600"></label>
      <label class="check"><input type="checkbox" name="alerts" checked><span data-i18n="dlg.alerts"></span></label>
      <label class="check"><input type="checkbox" name="saveEvents" checked><span data-i18n="dlg.saveEvents"></span></label>
      <fieldset id="ha-box">
        <legend data-i18n="ha.title">Icone Home Assistant</legend>
        <p class="note" data-i18n="ha.hint"></p>
        <div id="ha-rows"></div>
        <datalist id="ha-entities"></datalist>
      </fieldset>
      <p id="error" class="error" hidden></p>
      <div class="actions">
        <button type="button" id="btn-delete" class="danger" hidden data-i18n="btn.delete">Elimina</button>
        <div class="spacer"></div>
        <button type="button" id="btn-cancel" data-i18n="btn.cancel">Annulla</button>
        <button type="submit" class="primary" id="btn-save" data-i18n="btn.save">Salva</button>
      </div>
    </form>
  </dialog>

  <!-- Cambio password (obbligatorio al primo accesso) -->
  <dialog id="pwdlg">
    <form id="pwform" method="dialog" autocomplete="off">
      <h2 data-i18n="pw.title"></h2>
      <p id="pw-must" class="note" data-i18n="pw.mustChange" hidden></p>
      <label><span data-i18n="pw.current"></span><input name="current" type="password" autocomplete="current-password" required></label>
      <label><span data-i18n="pw.new"></span><input name="next" type="password" autocomplete="new-password" minlength="8" required></label>
      <label><span data-i18n="pw.confirm"></span><input name="again" type="password" autocomplete="new-password" minlength="8" required></label>
      <p id="pw-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <div class="spacer"></div>
        <button type="button" id="pw-cancel" data-i18n="btn.cancel"></button>
        <button type="submit" class="primary" id="pw-save" data-i18n="pw.save"></button>
      </div>
    </form>
  </dialog>

  <!-- Impostazioni -->
  <dialog id="settings" class="wide">
    <div class="dlg-head"><h2 data-i18n="set.title">Impostazioni</h2><div class="spacer"></div><button id="settings-close" aria-label="Close">✕</button></div>
    <div id="settings-body" class="dlg-body"></div>
    <div class="actions"><div class="spacer"></div><button class="primary" id="settings-save" data-i18n="btn.save">Salva</button></div>
  </dialog>

  <!-- Eventi, ricerca e persone -->
  <dialog id="events" class="wide tall">
    <div class="dlg-head">
      <h2 id="events-title"></h2>
      <div class="tabs"><button data-tab="events" class="on"></button><button data-tab="people" class="admin-only"></button><button data-tab="pets" class="admin-only"></button><button data-tab="vehicles" class="admin-only"></button></div>
      <div class="spacer"></div>
      <button id="events-close" aria-label="Close">✕</button>
    </div>
    <div id="events-body" class="dlg-body"></div>
  </dialog>

  <!-- Campanello -->
  <dialog id="bell" class="wide">
    <div class="dlg-head"><h2 id="bell-title"></h2><div class="spacer"></div><button id="bell-close" aria-label="Close">✕</button></div>
    <div id="bell-video" class="bell-video"></div>
    <p id="bell-note" class="note"></p>
    <div class="bell-controls">
      <button id="bell-talk" class="talk"></button>
      <label class="check"><input type="checkbox" id="bell-hands"><span data-i18n="bell.handsFree"></span></label>
      <label class="inline"><span data-i18n="bell.mic"></span><select id="bell-mic"></select></label>
    </div>
  </dialog>

  <div id="toasts"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
